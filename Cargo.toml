[workspace]
members = ["crates/core", "crates/model", "crates/cli", "crates/wasm", "crates/desktop", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
zefix-core = { path = "crates/core", default-features = false }
zefix-model = { path = "crates/model" }
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
rmcp = { version = "3.12.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "1.2.1"
# Pinned exactly: the generated JavaScript must match the wasm-bindgen CLI in web/scripts.
wasm-bindgen = "=0.2.130"

# Smaller and faster WebAssembly; the CLI profits as well.
[profile.release]
lto = true
codegen-units = 1
