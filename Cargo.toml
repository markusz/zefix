[workspace]
members = ["crates/core", "crates/cli", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
schafsim-core = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
comfy-table = { version = "8.0.1", default-features = false }
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
