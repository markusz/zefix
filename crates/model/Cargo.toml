[package]
name = "zefix-model"
description = "The scenario as the UI edits it, share links, TOML and a stepped simulation; front-end independent"
version.workspace = true
edition.workspace = true

[features]
# Native front ends simulate on all cores; the browser has no threads.
parallel = ["zefix-core/parallel"]

[dependencies]
zefix-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
