<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schafsim</title>
    <link data-trunk rel="rust" data-bin="schafsim-app">
    <style>
        :root { color-scheme: light dark; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #ecebe6; }
        @media (prefers-color-scheme: dark) { html, body { background: #141413; } }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #loading {
            position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
            font: 16px system-ui, sans-serif; color: #7a7972;
        }
    </style>
</head>
<body>
    <canvas id="schafsim_canvas"></canvas>
    <p id="loading">Lädt …</p>
</body>
</html>
