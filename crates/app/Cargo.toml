[package]
name = "zefix-app"
description = "Desktop and web front end for zefix-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zefix-app"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui_extras.workspace = true
zefix-core.workspace = true
web-time.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Threads exist everywhere but in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zefix-core = { workspace = true, features = ["parallel"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu", "eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
# Same version eframe uses; adds what it leaves out for updating the address bar.
web-sys = { version = "0.3.103", features = [
    "DomRect",
    "Element",
    "FocusOptions",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Window",
] }
