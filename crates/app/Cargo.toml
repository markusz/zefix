[package]
name = "schafsim-app"
description = "Desktop and web front end for schafsim-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "schafsim-app"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui_extras.workspace = true
schafsim-core.workspace = true
web-time.workspace = true

# Threads exist everywhere but in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
schafsim-core = { workspace = true, features = ["parallel"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu", "eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
